services:
  dev:
    build: .
    image: viana-dev:latest

    container_name: viana_core

    ports:
      - "8000:8000"
    
    environment:
      - PYTHONPATH=/app/ViAna/src
      - VIANA_OUTPUT_PARENT=/data/viana-outputs
    
    # 1. Volume Mounts (The "Live Link")
    # Maps current directory (.) to /app/ViAna inside container
    volumes:
      - .:/app/ViAna
      # Mount host data root (adjust path on your machine):
      - ${VIANA_DATA_ROOT:-./data}:/data
    
    # 2. Working Directory
    working_dir: /app/ViAna
    
    # 3. GPU Configuration
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    
    # 4. Orchestrator API. Editable install may be missing if the image predates pyproject deps.
    stdin_open: true
    tty: true
    command:
      - bash
      - -lc
      - python3 -c "import uvicorn,fastapi,orchestrator" 2>/dev/null || pip3 install -e ".[dev]"; pip3 install -q "numpy>=1.26.0,<2"; pip3 install -q "trackers==2.6.0" --no-deps; exec python3 -m uvicorn orchestrator.app:app --host 0.0.0.0 --port 8000 --app-dir src
    
    # 5. Shared Memory (Crucial for PyTorch/Dataloaders)
    shm_size: '8gb'