services:
  dev:
    build: .
    image: viana-dev:latest

    container_name: viana_core

    ports:
      - "8000:8000"
    
    environment:
      - PYTHONPATH=/app/ViAna/src
      - VIANA_OUTPUT_PARENT=/data/viana-outputs
      # Step 6.7 — host→container path maps for POST /jobs/intake (S09 / F006)
      - VIANA_HOST_REPO_ROOT=${COMPOSE_PROJECT_DIR:-${PWD}}
      - VIANA_HOST_DATA_ROOT=${VIANA_DATA_ROOT:-${COMPOSE_PROJECT_DIR:-${PWD}}/data}
      - VIANA_INTAKE_ROOTS=/data:/app/ViAna${VIANA_EXTRA_INTAKE_ROOT:+:${VIANA_EXTRA_INTAKE_ROOT}}
      - VIANA_PATH_MAPS=${VIANA_PATH_MAPS:-}
    
    # 1. Volume Mounts (The "Live Link")
    # Maps current directory (.) to /app/ViAna inside container
    volumes:
      - .:/app/ViAna
      # Mount host data root (adjust path on your machine):
      - ${VIANA_DATA_ROOT:-./data}:/data
      # Optional extra video tree (G21 / Step 6.7). Set both env vars and uncomment:
      #   VIANA_EXTRA_DATA_ROOT=/mnt/ext-hdd/videos
      #   VIANA_EXTRA_INTAKE_ROOT=/mnt/extra
      #   VIANA_PATH_MAPS=/mnt/ext-hdd/videos->/mnt/extra
      # - ${VIANA_EXTRA_DATA_ROOT}:/mnt/extra
    
    # 2. Working Directory
    working_dir: /app/ViAna
    
    # 3. GPU Configuration
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    
    # 4. Orchestrator API. numpy<2 + trackers==2.6.0 --no-deps are baked into the image (Step 6.1).
    stdin_open: true
    tty: true
    command:
      - python3
      - -m
      - uvicorn
      - orchestrator.app:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --app-dir
      - src
    
    # 5. Shared Memory (Crucial for PyTorch/Dataloaders)
    shm_size: '8gb'

    # Soft nofile often defaults to 1024; raise to avoid S22-style EMFILE → API 502.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
